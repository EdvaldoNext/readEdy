<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReadEdy</title>
</head>
<body style="margin:0;padding:0;background:#0a0b10;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0a0b10;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellspacing="0" cellpadding="0" style="max-width:480px;width:100%;">
          <tr>
            <td align="center" style="padding:8px 0 24px;">
              <div style="font-size:28px;font-weight:800;letter-spacing:0.04em;color:#ffffff;">ReadEdy</div>
              <div style="font-size:13px;color:#c9cdd8;padding-top:6px;">Leia e ouça seus PDFs com voz natural</div>
            </td>
          </tr>
          <tr>
            <td style="background:#161821;border:1px solid #2a2d3a;border-radius:16px;padding:28px 24px;">
              <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;color:#ffffff;">Seu link de acesso</h1>
              <p style="margin:0 0 20px;font-size:15px;line-height:1.55;color:#c9cdd8;">
                Use o botão abaixo para entrar no ReadEdy.
                O link expira em breve e só pode ser usado uma vez.
              </p>
              <p style="margin:0 0 24px;text-align:center;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#F8991D;color:#111111;font-weight:800;text-decoration:none;padding:14px 28px;border-radius:999px;">
                  Entrar no ReadEdy
                </a>
              </p>
              <p style="margin:0;font-size:13px;line-height:1.5;color:#8b90a0;">
                Se você não pediu este acesso, ignore este e-mail.
              </p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:20px 8px 0;font-size:12px;line-height:1.5;color:#8b90a0;">
              Este e-mail foi enviado pelo ReadEdy.<br>
              Não responda esta mensagem.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
